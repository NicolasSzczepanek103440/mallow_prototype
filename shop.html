<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="styles/shop.css">
    <link rel="stylesheet" href="styles/animation.css">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="icon" href="images/icons/Mallow_favicon.png">

    <script src="global_code/boombox.js" defer></script>
    <script src="global_code/ricochet_system.js" defer></script>
    <script src="global_code/curtain.js" defer></script>
    <script src="global_code/page_change.js" defer></script>
    <script src="global_code/functions.js" defer></script>
    <script src="global_code/shop_functions.js" defer></script>
    <script src="global_code/player_stats.js" defer></script>
    <script src="global_code/money.js" defer></script>
</head>
<body onload="curtainDo('up')">
    <div class="background_container">
        <img src="images/backgrounds/background_shop.jpg" class="background_woonkamer" alt="">
    </div>

    <div class="curtain">
        <img src="images/curtain.png">
    </div>

    <div class="howmuchcashcontainer_adjust">
        <div class="howmuchcash_container">
            <div class="howmuch_cash">
                <div class="cash_icon">
                    <img src="images/icons/coinicon_template.png" alt="">
                </div>
                <div class="cash_amount">
                    $--
                </div>
            </div>
            <div class="cash_show" onclick="cashShow('hide')">
                <div class="arrow_moneybar"></div>
            </div>
        </div>
        
    </div>

   <div class="locationbar_container"> <!-- Deze bar wordt gebruikt om naar verschillende pagina's te gaan -->
        <div class="back_locationbar">
            <div class="back_locationbartext">Locaties</div>
            <div class="location_bar"> 
            <a href="living_room.html"><div class="locationbar_option">Woonkamer</div></a> <!-- !! JAVASCRIPT -->
            <a href="bathroom.html"><div class="locationbar_option">Badkamer</div></a> <!-- !! JAVASCRIPT -->
            <a href="shop.html"><div class="locationbar_option shop current" onclick="page_change('shop')">Shop</div></a> <!-- !! JAVASCRIPT -->
        </div>
        </div>
        
        <div class="arrowcontainer_locationbar">
            <div class="arrow_locationbar" onclick="tab_show('top_bar1')"></div>
        </div>
    </div>

    <div id="shop_container">
        <div id="shop_interface">
            <div id="shop_selectitem">
                <div class="select category_unselected hoeden" onclick='openShopTab("hoeden")'>
                    <b>Hoeden</b>
                </div>
                <div class="select category_unselected kleren" onclick='openShopTab("kleren")'>
                    <b>Kleren</b>
                </div>

                <div id="reset_costumes" onclick="resetMallowCostume()">
                    Reset Mallo
                </div>
            </div>

            <div id="shop_itemselectcontainer">
                <div id="item_container">
                </div>
                
            </div>
            <div id="mallowdressup_container">

                <div id="options_container">
                    <div id="name_container">
                        name
                    </div>

                    <div id="cost_container">
                        $--
                    </div>

                    <div id="container_equiporbuy">

                        <div class="equip_button lock_equip">
                            Equip
                            <div id="lock">
                                <img src="images/icons/lock_template.png" alt="">
                            </div>
                        </div>

                        <div class="buy_button">Kopen</div>
                    </div>
                    

                </div>
                
                <div id="bottomcontainer_container">
                    <div id="mallow_preview">
                        <img id="mallow_previewimg">
                    </div>
                    <div id="mallow_platform_container">
                        <div id="mallow_platform"></div>
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

    <div class="game_options"> <!-- Dit zijn de knoppen waarmee de gebruiker naar de hoofdscherm of instellingen kan gaan-->
        <div class="main_buttons">
            <div class="mainmenu_knop" onclick="page_change('hoofdmenu')">Hoofdmenu</div> <!-- Teruggaan naar hoofdmenu -->
        </div>

        <div class="terug_button" onclick="normalMode()">
            Terug
        </div>
    </div>


    <div class="boombox_container">
        <div class="boombox_move" onclick="boomboxMove(true)">
            <img src="images/icons/carry_icontemplate.png" alt="">
        </div>

        <div class="boombox"> <!-- Boombox om muziek te veranderen -->
            <div class="boombox_touch" onclick="boomboxOpen('open')">
                <img src="images/boombox_placeholder.png">
            </div>

            <div class="boombox_openmenu">
                <div class="nowplaying_box">
                    <div class="song_and_artist">Geen lied geselecteerd!</b></div>
                    <div class="album_and_artist">
                        <div class="album">
                            <img class="album_img" src="images//icons/Mallow_icon.jpg">
                        </div>
                        <div class="artist">
                            <img class="artist_img" src="images/icons/Mallow_icon.jpg">
                        </div>
                    </div>
                    
                </div>
                <div class="rest_box">

                    <div class="controls_box">
                                    <div class="loop_music" onclick="loop('true')">
                                        <img src="images/loop.jpg">
                                    </div>
                                    <audio controls>
                                        <source src="" type="audio/mp3">
                                    </audio>
                    </div>

                    <div class="songselect_container">
                                    <div class="song_select" onclick="selecteerLied('open')">
                                        <b>Selecteer lied</b>
                                    </div>

                                    <div class="songselect_menu"> 
                                        <div class="songselect_song, template">
                                            <div class="songselectsong_name">song1</div>
                                            <div class="songselectsong_album">artist</div>
                                                <div class="album_cover">
                                                    <img src="images/placeholder.png" alt="">
                                                </div>
                                                <div class="pfp_artist">
                                                    <img src="images/placeholder.png" alt="">
                                                </div>
                                            <div class="click_to_select unselected"></div>
                                        </div>
                                    </div>  
                                </div>
                            </div>
                </div>
        </div>
    </div>

</body>
</html>
