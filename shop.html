<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="styles/shop.css">
    <link rel="stylesheet" href="styles/animation.css">
    <link rel="stylesheet" href="styles/general.css">

    <script src="global_code/page_change.js" defer></script>
    <script src="global_code/functions.js" defer></script>
    <script src="global_code/shop_functions.js" defer></script>
</head>
<body>
    <div class="background_container">
        <img src="images/backgrounds/background_shop.jpg" class="background_woonkamer" alt="">
    </div>

    <div class="locationbar_container"> <!-- Deze bar wordt gebruikt om naar verschillende pagina's te gaan -->
        <div class="back_locationbar">
            <div class="location_bar"> 
            <a><div class="locationbar_option current">woonkamer</div></a> <!-- !! JAVASCRIPT -->
            <a><div class="locationbar_option">badkamer</div></a> <!-- !! JAVASCRIPT -->
            <a><div class="locationbar_option shop" onclick="page_change('shop')">shop</div></a> <!-- !! JAVASCRIPT -->
        </div>
        </div>
        
        <div class="arrowcontainer_locationbar">
                <div class="arrow_locationbar">
                    <img src="images/Polygon 1.jpg" onclick="tab_show('top_bar1')">
                </div>
            </div>
    </div>

    <div id="shop_interface">
        <div id="shop_selectitem">
            <div class="select category_unselected hoeden" onclick='openShopTab("hoeden")'>
                <b>Hoeden</b>
            </div>
            <div class="select category_unselected kleren" onclick='openShopTab("kleren")'>
                <b>Kleren</b>
            </div>
            <div class="select category_unselected achtergronden" onclick='openShopTab("achtergronden")'>
                <b>Achtergronden</b>
            </div>
        </div>

        <div id="shop_itemselectcontainer">
            <div id="item_container">
            </div>
            
        </div>
        <div id="mallowdressup_container">

            <div id="options_container">
                <div id="name_container">
                    name
                </div>

                <div id="cost_container">
                    $--
                </div>

                <div id="container_equiporbuy">

                    <div id="equip_button" class="lock_equip">
                        Equip
                        <div id="lock">
                            <img src="images/icons/lock_template.png" alt="">
                        </div>
                    </div>

                    <div id="buy_button">Buy</div>
                </div>
                

            </div>
            
            
            <div id="bottomcontainer_container">
                <div id="mallow_preview">
                    <img id="mallow_previewimg" src="images/mallow_sprites/mallow_front.png">
                </div>
                <div id="mallow_platform_container">
                    <div id="arrow_left">
                        <span><</span>
                    </div>
                    <div id="mallow_platform"></div>
                    <div id="arrow_right">
                        <span>></span>
                    </div>
                </div>
            </div>
            
        </div>
        
    </div>

    


    <div class="boombox"> <!-- Boombox om muziek te veranderen -->
        
        <div class="boombox_touch" onclick="boomboxOpen('open')">
            <img src="images/boombox_placeholder.png">
        </div>

        <div class="boombox_openmenu">
            <div class="nowplaying_box">
                <div class="song_and_artist">Now playing:<br><b>[song], [artist]</b></div>


                <div class="album_and_artist">
                    <div class="album">
                        <img src="images/placeholder.png">
                    </div>
                    <div class="artist">
                        <img src="images/placeholder.png">
                    </div>
                </div>
                
            </div>

            <div class="controls_box">
                <div class="loop_music" onclick="loop('true')">
                    <img src="images/loop.jpg">
                </div>
                <audio controls>
                    <source src="" type="audio/mp3">
                </audio>
            </div>

            <div class="songselect_container">
                <div class="song_select" onclick="selecteerLied('open')">
                    <b>Selecteer lied</b>
                </div>

                <div class="songselect_menu"> 
                    <div class="songselect_song, template"> <!-- Template -->
                        <div class="songselectsong_name">song1</div>
                        <div class="songselectsong_album">artist</div>
                            <div class="album_cover">
                                <img src="images/placeholder.png" alt="">
                            </div>
                            <div class="pfp_artist">
                                <img src="images/placeholder.png" alt="">
                            </div>
                        <div class="click_to_select unselected"></div>
                    </div>
                </div>  
            </div>
        </div>
    </div>

    <div class="game_options"> <!-- Dit zijn de knoppen waarmee de gebruiker naar de hoofdscherm of instellingen kan gaan-->
        <div class="mainmenu_knop" onclick="page_change('hoofdmenu')">Hoofdmenu</div> <!-- Teruggaan naar hoofdmenu -->
        <div class="settings_box">
            <img src="images/settings_placeholder.png">
        </div>
    </div>
    
</body>
</html>
