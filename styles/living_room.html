<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woonkamer</title>
    <link rel="stylesheet" href="styles/living_room.css">
    <link rel="stylesheet" href="styles/animation.css">
    <link rel="stylesheet" href="styles/general.css">

    <script src="global_code/page_change.js" defer></script>
    <script src="global_code/functions.js" defer></script>
    <script src="global_code/mallow_functions.js" defer></script>
</head>
<body>
    <img src="images/livingroom_template.jpg" class="achtergrond">

    <div class="locationbar_container"> <!-- Deze bar wordt gebruikt om naar verschillende pagina's te gaan -->
        <div class="back_locationbar">
            <div class="location_bar"> 
            <a><div class="locationbar_option current">woonkamer</div></a> <!-- !! JAVASCRIPT -->
            <a><div class="locationbar_option">badkamer</div></a> <!-- !! JAVASCRIPT -->
            <a><div class="locationbar_option">--</div></a> <!-- !! JAVASCRIPT -->
            <a><div class="locationbar_option shop">shop</div></a> <!-- !! JAVASCRIPT -->
        </div>
        </div>
        
        <div class="arrowcontainer_locationbar">
                <div class="arrow_locationbar">
                    <img src="images/Polygon 1.jpg" onclick="tab_show('top_bar1')">
                </div>
            </div>
    </div>

    <div class="mallow_status"> <!-- Hier wordt de status van Mallow weergegeven -->
        <div class="mallow_icon">
            <img src="images/mallow_template.jpg">
        </div>
        <div class="percentages_en_icoontjes"> <!-- Hier worden de percentages en icoontjes vertoont -->
            <div class="foodicon_container">
                <div class="food_icon">
                    <img src="images/placeholder.png">
                </div>
                <div class="food_icon">
                    <img src="images/placeholder.png">
                </div>
                <div class="food_icon">
                    <img src="images/placeholder.png">
                </div>
            </div>
            
            <div class="percentage_container">
                <div class="percentage"><span>100%</span></div>
                <div class="percentage"><span>100%</span></div>
                <div class="percentage"><span>100%</span></div>
            </div>
        </div>
        <div class="bars">
            <div class="bar">
                <div class="inside_bar"></div>
            </div>
            <div class="bar">
                <div class="inside_bar"></div>
            </div>
            <div class="bar">
                <div class="inside_bar"></div>
            </div>
        </div>
    </div>


    <div class="playbar_container"> <!-- Deze bar wordt gebruikt om bepaalde dingen te doen binnen een locatie -->    
        <div class="back_playbar">
            <div class="play_bar"> <!-- Deze bar wordt gebruikt om verschillende dingen te doen met Mallow -->
            <div class="playbar_option">a</div>
            <div class="playbar_option">b</div>
            <div class="playbar_option">c</div>
            <div class="playbar_option">d</div>
        </div>
        </div>

        <div class="arrowcontainer_playerbar">
                <div class="arrow_playerbar" onclick="tab_show('side_bar1')"></div>
            </div>

    </div>


    <div class="boombox"> <!-- Boombox om muziek te veranderen -->
        
        <div class="boombox_touch" onclick="boomboxOpen('open')">
            <img src="images/boombox_placeholder.png">
        </div>

        
        
        
        <div class="boombox_openmenu">
            <div class="nowplaying_box">
                <div class="song_and_artist">Now playing:<br><b>[song], [artist]</b></div>


                <div class="album_and_artist">
                    <div class="album">
                        <img src="images/placeholder.png">
                    </div>
                    <div class="artist">
                        <img src="images/placeholder.png">
                    </div>
                </div>
                
            </div>

            <div class="controls_box">
                <div class="loop_music" onclick="loop('true')">
                    <img src="images/loop.jpg">
                </div>
                <audio controls>
                    <source src="" type="audio/mp3">
                </audio>
            </div>

            <div class="songselect_container">
                <div class="song_select" onclick="selecteerLied('open')">
                    <b>Selecteer lied</b>
                </div>

                <div class="songselect_menu"> 
                    <div class="songselect_song, template"> <!-- Template -->
                        <div class="songselectsong_name">song1</div>
                        <div class="songselectsong_album">artist</div>
                            <div class="album_cover">
                                <img src="images/placeholder.png" alt="">
                            </div>
                            <div class="pfp_artist">
                                <img src="images/placeholder.png" alt="">
                            </div>
                        <div class="click_to_select unselected"></div>
                    </div>
                </div>  
            </div>
        </div>
        
        
    </div>

    <div class="bordermove_mallow"> <!-- Dit is de maximale breedte en hoogte waarop Mallow kan bewegen-->
        <div class="mallow"> <!-- Dit is Mallow zelf -->
            <img src="images/mallow_template.jpg">
        </div>
    </div>

    <div class="now_playing"> <!-- Bar dat aangeeft welk lied er nu speelt en van welk artiest het vandaan komt -->
        <span class="artist_name">artist_name</span>
        <span class="song_name">song_name</span>
        <div class="icon_album"><img src="images/placeholder.png"></div>
    </div> 

    <div class="game_options"> <!-- Dit zijn de knoppen waarmee de gebruiker naar de hoofdscherm of instellingen kan gaan-->
        <div class="mainmenu_knop" onclick="page_change('hoofdmenu')">Hoofdmenu</div> <!-- Teruggaan naar hoofdmenu -->
        <div class="settings_box">
            <img src="images/settings_placeholder.png">
        </div>
    </div>
    
</body>
</html>
