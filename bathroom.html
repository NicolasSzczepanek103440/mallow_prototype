<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badkamer</title>
    <link rel="stylesheet" href="styles/living_room.css">
    <link rel="stylesheet" href="styles/animation.css">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="icon" href="images/icons/Mallow_favicon.png">

    <script src="global_code/page_change.js" defer></script>
    <script src="global_code/functions.js" defer></script>
    <script src="global_code/mallow_functions.js" defer></script>
    <script src="global_code/bar_system.js" defer></script>
    <script src="global_code/living_room.js" defer></script>
</head>
<body onload="curtainDo('up')">
    <div class="curtain">
        <img src="images/curtain.png">
    </div>

    <div class="background_container">

        <div id="backgroundprop_cattree" class="background_prop">
            <img src="images/backgrounds/background_props/cattree.png" alt="">
        </div>

        <div id="backgroundprop_foodandwater" class='background_prop'>
                <img src="images/backgrounds/background_props/FoodBowl.png">
                <img src="images/backgrounds/background_props/WaterBowl.png">
        </div>

        <img src="images/backgrounds/background_woonkamer.jpg" class="background_woonkamer" alt="">
    </div>

    <div class="locationbar_container"> <!-- Deze bar wordt gebruikt om naar verschillende pagina's te gaan -->
        <div class="back_locationbar">
            <div class="back_locationbartext">Locaties</div>
            <div class="location_bar"> 
            <a href="living_room.html"><div class="locationbar_option current">woonkamer</div></a> <!-- !! JAVASCRIPT -->
            <a><div class="locationbar_option">badkamer</div></a> <!-- !! JAVASCRIPT -->
            <a href="shop.html"><div class="locationbar_option shop" onclick="page_change('shop')">shop</div></a> <!-- !! JAVASCRIPT -->
        </div>
        </div>
        
        <div class="arrowcontainer_locationbar">
                <div class="arrow_locationbar">
                    <img src="images/Polygon 1.jpg" onclick="tab_show('top_bar1')">
                </div>
            </div>
    </div>

    <div class="mallow_status"> <!-- Hier wordt de status van Mallow weergegeven -->
        <div class="mallow_icon" onclick="clickStatus('open')">
            <img src="images/mallow_sprites/mallow_front.png">
        </div>
        <div class="percentages_en_icoontjes"> <!-- Hier worden de percentages en icoontjes vertoond -->
            <div class="foodicon_container">
                <div class="food_icon">
                    <img src="images/icons/foodicon_template.png">
                </div>
                <div class="food_icon">
                    <img src="images/icons/drinkicon_template.png">
                </div>
                <div class="food_icon">
                    <img src="images/icons/hygieneicon_template.jpg">
                </div>
            </div>
            
            <div class="percentage_container">
                <div class="percentage_box"><span class="percent percent_food">100%</span></div>
                <div class="percentage_box"><span class="percent percent_thirst">100%</span></div>
                <div class="percentage_box"><span class="percent percent_hygiene">100%</span></div>
            </div>
        </div>
        <div class="bars">
            <div class="bar">
                <div class="inside_bar food"></div>
            </div>
            <div class="bar">
                <div class="inside_bar thirst"></div>
            </div>
            <div class="bar">
                <div class="inside_bar hygiene"></div>
            </div>
        </div>
    </div>


    <div class="playbar_container"> <!-- Deze bar wordt gebruikt om bepaalde dingen te doen binnen een locatie -->    
        
        
        <div class="back_playbar">
            <div class="playbar_titel">Interacties</div>
            <div class="play_bar"> <!-- Deze bar wordt gebruikt om verschillende dingen te doen met Mallow -->
            <div class="playbar_option" onclick="interactie('voeren')">voeren</div>
            <div class="playbar_option">b</div>
            <div class="playbar_option">c</div>
        </div>
        </div>

        <div class="arrowcontainer_playerbar">
                <div class="arrow_playerbar" onclick="tab_show('side_bar1')"></div>
            </div>

    </div>

    <div class="boombox_container">
        <div class="boombox_move" onclick="boomboxMove(true)">
            <img src="images/icons/carry_icontemplate.png" alt="">
        </div>

        <div class="boombox"> <!-- Boombox om muziek te veranderen -->
            <div class="boombox_touch" onclick="boomboxOpen('open')">
                <img src="images/boombox_placeholder.png">
            </div>

            <div class="boombox_openmenu">
                <div class="nowplaying_box">
                    <div class="song_and_artist">Geen lied geselecteerd!</b></div>
                    <div class="album_and_artist">
                        <div class="album">
                            <img class="album_img" src="images//icons/Mallow_icon.jpg">
                        </div>
                        <div class="artist">
                            <img class="artist_img" src="images/icons/Mallow_icon.jpg">
                        </div>
                    </div>
                    
                </div>
                <div class="rest_box">

                    <div class="controls_box">
                                    <div class="loop_music" onclick="loop('true')">
                                        <img src="images/loop.jpg">
                                    </div>
                                    <audio controls>
                                        <source src="" type="audio/mp3">
                                    </audio>
                    </div>

                    <div class="songselect_container">
                                    <div class="song_select" onclick="selecteerLied('open')">
                                        <b>Selecteer lied</b>
                                    </div>

                                    <div class="songselect_menu"> 
                                        <div class="songselect_song, template">
                                            <div class="songselectsong_name">song1</div>
                                            <div class="songselectsong_album">artist</div>
                                                <div class="album_cover">
                                                    <img src="images/placeholder.png" alt="">
                                                </div>
                                                <div class="pfp_artist">
                                                    <img src="images/placeholder.png" alt="">
                                                </div>
                                            <div class="click_to_select unselected"></div>
                                        </div>
                                    </div>  
                                </div>
                            </div>
                </div>
        </div>
    </div>

    

            

    <div class="item" onclick="itemDrag()"></div>

    <div class="mallow_container"> <!-- Dit is de maximale breedte en hoogte waarop Mallow kan bewegen-->
        <div class="mallow" onclick="mallowPet()"> <!-- Dit is Mallow zelf -->
            <img class="mallow_img" src="images/hoeden/Feesthoed.png">
        </div>
    </div>

    <div class="game_options"> <!-- Dit zijn de knoppen waarmee de gebruiker naar de hoofdscherm of instellingen kan gaan-->
        <div class="mainmenu_knop" onclick="page_change('hoofdmenu')">Hoofdmenu</div> <!-- Teruggaan naar hoofdmenu -->
        <div class="settings_box">
            <img src="images/settings_placeholder.png">
        </div>
    </div>
    
</body>
</html>
